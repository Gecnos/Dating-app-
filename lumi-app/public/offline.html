<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne - Lumi</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #101322;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #D4AF37;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 8px; }
  p { color: #9aa0b4; font-size: 0.9rem; max-width: 280px; margin: 0 0 24px; }
  button {
    background: #D4AF37;
    color: #101322;
    border: none;
    padding: 12px 32px;
    border-radius: 999px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.75rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="mark"></div>
  <h1>Pas de connexion</h1>
  <p>Lumi a besoin d'internet pour charger cette page. Vérifiez votre connexion et réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
